<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Posts do Instagram · Fan Joy Store</title>
<link rel="icon" href="../img/logo.webp">
<link rel="stylesheet" href="post.css">
<style>
  body { margin: 0; background: var(--tint); color: var(--navy); font: 400 16px/1.5 var(--body); }
  .app { display: grid; grid-template-columns: minmax(300px, 400px) 1fr; gap: 28px; max-width: 1280px; margin: 0 auto; padding: 24px 16px 40px; align-items: start; }
  @media (max-width: 860px) { .app { grid-template-columns: 1fr; } .preview-col { order: -1; } }
  h1.tool-title { margin: 0 0 4px; font: 400 30px/1.15 var(--display); }
  .tool-sub { margin: 0 0 18px; color: var(--muted); font-size: 15px; }
  .panel { background: var(--white); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 14px; }
  .field { display: grid; gap: 6px; }
  .field > span { font-weight: 600; font-size: 14px; }
  .field small { color: var(--muted); font-size: 13px; }
  input[type=text], input[type=number], select, textarea { width: 100%; box-sizing: border-box; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: inherit; color: inherit; background: var(--white); }
  textarea { resize: vertical; min-height: 84px; }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 3px solid #F6C343; outline-offset: 1px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 15px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 22px; border-radius: 999px; border: 2px solid var(--red); background: var(--red); color: var(--white); font: 700 16px/1 var(--body); cursor: pointer; }
  .btn:hover { background: var(--red-ink); border-color: var(--red-ink); }
  .btn:disabled { opacity: .6; cursor: progress; }
  .btn-ghost { background: transparent; color: var(--navy); border-color: var(--navy); }
  .btn-ghost:hover { background: var(--navy); color: var(--white); border-color: var(--navy); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .status { min-height: 1.4em; margin: 0; font-size: 14px; color: var(--muted); }
  .preview-col { position: sticky; top: 16px; }
  .stage { width: 100%; aspect-ratio: 1080 / 1350; position: relative; overflow: hidden; border-radius: 6px; box-shadow: 0 10px 30px rgba(22, 34, 79, .12); background: var(--white); }
  .stage .post { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
  .hint { margin: 10px 0 0; color: var(--muted); font-size: 13px; text-align: center; }
  fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 14px; }
  legend { font: 400 20px/1.2 var(--display); padding: 0; margin-bottom: 2px; }
</style>
</head>
<body>
<div class="app">
  <div>
    <h1 class="tool-title">Posts do Instagram</h1>
    <p class="tool-sub">Escolha um produto da loja ou crie um novo, ajuste os textos e baixe a imagem no tamanho do feed (1080 × 1350).</p>
    <form class="panel" id="form" autocomplete="off">
      <label class="field"><span>Produto</span>
        <select id="f-product"></select>
        <small>Os dados vêm do catálogo da loja. Tudo abaixo pode ser editado só para este post.</small>
      </label>
      <fieldset>
        <legend>Foto</legend>
        <label class="field"><span>Trocar a foto</span><input type="file" id="f-photo" accept="image/*"><small>Fotos quadradas ficam melhores na moldura.</small></label>
        <label class="field"><span>Enquadramento</span>
          <select id="f-fit"><option value="cover">Preencher a moldura (pode cortar as bordas)</option><option value="contain">Mostrar a foto inteira</option></select>
        </label>
      </fieldset>
      <fieldset>
        <legend>Textos</legend>
        <label class="field"><span>Selo (opcional)</span><input type="text" id="f-badge" maxlength="22" placeholder="Ex.: Novidade, Pronta entrega"></label>
        <label class="field"><span>Linha acima do nome (opcional)</span><input type="text" id="f-eyebrow" maxlength="40" placeholder="Ex.: nome da coleção"></label>
        <label class="field"><span>Nome do produto</span><input type="text" id="f-name" maxlength="60"></label>
        <label class="field"><span>Descrição curta</span><textarea id="f-short" maxlength="110" rows="2"></textarea></label>
        <label class="field"><span>Detalhes</span><textarea id="f-details" rows="3"></textarea><small>Um por linha, até 3.</small></label>
      </fieldset>
      <fieldset>
        <legend>Preço</legend>
        <div class="row">
          <label class="field"><span>Valor (R$)</span><input type="number" id="f-price" min="0" step="0.01" inputmode="decimal"></label>
          <label class="field"><span>Desconto no Pix (%)</span><input type="number" id="f-pix" min="0" max="50" step="1" inputmode="numeric"></label>
        </div>
        <label class="check"><input type="checkbox" id="f-from"> Mostrar “a partir de” (quando há opções mais caras)</label>
        <label class="field"><span>Parcelamento</span><input type="text" id="f-installments" maxlength="40"></label>
      </fieldset>
      <fieldset>
        <legend>Rodapé</legend>
        <label class="field"><span>Chamada</span><input type="text" id="f-cta" maxlength="40"></label>
        <label class="field"><span>Aviso em letra pequena (opcional)</span><input type="text" id="f-note" maxlength="120"></label>
      </fieldset>
      <div class="actions">
        <button class="btn" type="submit" id="download">Baixar imagem</button>
        <button class="btn btn-ghost" type="button" id="reset">Voltar aos dados da loja</button>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </form>
  </div>

  <div class="preview-col">
    <div class="stage" id="stage">
      <article class="post" id="post" aria-label="Prévia do post">
        <header class="p-head">
          <div class="p-brand">
            <svg class="spark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0c.7 6.6 4.9 10.9 12 12-7.1 1.1-11.3 5.4-12 12-.7-6.6-4.9-10.9-12-12C7.1 10.9 11.3 6.6 12 0z" fill="currentColor"/></svg>
            <h1>FAN JOY STORE</h1>
            <svg class="spark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0c.7 6.6 4.9 10.9 12 12-7.1 1.1-11.3 5.4-12 12-.7-6.6-4.9-10.9-12-12C7.1 10.9 11.3 6.6 12 0z" fill="currentColor"/></svg>
          </div>
          <div class="p-rule"><span></span></div>
        </header>
        <div class="p-body">
          <figure class="frame"><div class="frame-photo" id="p-photo"></div></figure>
          <div class="info" id="p-info">
            <p class="p-badge" id="p-badge"></p>
            <p class="p-eyebrow" id="p-eyebrow"></p>
            <h2 class="p-name" id="p-name"></h2>
            <p class="p-short" id="p-short"></p>
            <ul class="p-details" id="p-details"></ul>
            <div class="p-price">
              <p class="p-from" id="p-from">a partir de</p>
              <p class="p-value" id="p-value"></p>
              <p class="p-pix" id="p-pix"></p>
              <p class="p-installments" id="p-installments"></p>
            </div>
          </div>
        </div>
        <footer class="p-foot">
          <p class="p-cta" id="p-cta"></p>
          <div class="p-mark"><img src="../img/logo.webp" alt=""></div>
          <p class="p-note" id="p-note"></p>
        </footer>
      </article>
    </div>
    <p class="hint">Prévia em tamanho reduzido. A imagem baixada sai em 1080 × 1350 px.</p>
  </div>
</div>
<script src="vendor/html-to-image.js"></script>
<script type="module" src="post.js"></script>
</body>
</html>
